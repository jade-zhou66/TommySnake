const el=id=>document.getElementById(id), canvas=el('board'),ctx=canvas.getContext('2d');
const N=12,S=canvas.width/N, images=photos.map(([name,url])=>{const img=new Image();img.onload=()=>draw();img.src=url;return img});
let snake,dir,queue,food,decoy,deck,points,phase,frameId,lastFrame,progress=0,record=0;
try{record=Number(localStorage.photoSnakeBest)||0}catch{}
const fmt=n=>String(n).padStart(2,'0');
function spawn(){
 const empty=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))empty.push({x,y});
 if(!deck.length){deck=images.map((_,i)=>i);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
 // Choose uniformly among the closest free pairs, including at the board edges.
 let closest=Infinity;
 const pairs=[];
 for(let i=0;i<empty.length;i++){
   for(let j=i+1;j<empty.length;j++){
     const a=empty[i], b=empty[j];
     const distance=Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
     if(distance>closest)continue;
     if(distance<closest){closest=distance;pairs.length=0}
     pairs.push([a,b]);
   }
 }
 const pair=pairs[Math.floor(Math.random()*pairs.length)];
 const side=Math.floor(Math.random()*2);
 food={...pair[side],i:deck.pop()};
 const offset=1+Math.floor(Math.random()*(images.length-1));
 decoy={...pair[1-side],i:(food.i+offset)%images.length};
 el('target').src=photos[food.i][1];el('target').alt=photos[food.i][0]
}
function reset(){progress=0;snake=[{x:4,y:6},{x:3,y:6},{x:2,y:6}];dir=[1,0];queue=[];deck=[];points=0;el('score').textContent='00';el('best').textContent=fmt(record);spawn();draw()}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function draw(){
 ctx.fillStyle='#cfdcb8';ctx.fillRect(0,0,600,600);ctx.fillStyle='#afbf9b';for(let y=0;y<=N;y++)for(let x=0;x<=N;x++)ctx.fillRect(x*S-1,y*S-1,2,2);
 for(const photo of [food,decoy]){
  if(!photo)continue;
  let x=(photo.x+.5)*S,y=(photo.y+.5)*S;circle(x,y,S*.5,'#a65932');circle(x,y,S*.46,'#fff1d2');ctx.save();ctx.beginPath();ctx.arc(x,y,S*.44,0,Math.PI*2);ctx.clip();if(images[photo.i].naturalWidth)ctx.drawImage(images[photo.i],x-S*.44,y-S*.44,S*.88,S*.88);ctx.restore()
 }
 // Move the head and tail along the grid path, keeping its corners in place.
 const head={x:snake[0].x+dir[0]*progress,y:snake[0].y+dir[1]*progress};
 const growing=snake.length<N*N-2 && food && snake[0].x+dir[0]===food.x && snake[0].y+dir[1]===food.y;
 const segments=snake.slice(1).map((p,i)=>({
   x:p.x+(snake[i].x-p.x)*progress,
   y:p.y+(snake[i].y-p.y)*progress
 }));
 const tail=growing?snake[snake.length-1]:segments[segments.length-1];
 const path=[head,...snake.slice(0,-1),tail];
 ctx.strokeStyle='#edb52a';ctx.lineWidth=S*.69;ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();path.forEach((p,i)=>ctx[i?'lineTo':'moveTo']((p.x+.5)*S,(p.y+.5)*S));ctx.stroke();
 segments.forEach(p=>circle((p.x+.5)*S,(p.y+.5)*S,S*.12,'#ffe590'));
 const x=(head.x+.5)*S,y=(head.y+.5)*S;circle(x,y,S*.44,'#f2b923');for(const sign of [-1,1]){let a=x+(dir[0]*.12-dir[1]*sign*.19)*S,b=y+(dir[1]*.12+dir[0]*sign*.19)*S;circle(a,b,S*.105,'#ffefcf');circle(a+dir[0]*2,b+dir[1]*2,S*.05,'#223628')}
}
function overlay(state,title,message,button){cancelAnimationFrame(frameId);phase=state;el('title').textContent=title;el('message').textContent=message;el('action').textContent=button;el('cover').hidden=false;el('pause').disabled=true}
function animate(now){
 if(phase!=='play')return;
 const duration=Math.max(125,295-(snake.length-3)*6)/1.15;
 progress+=Math.min(Math.max(0,now-lastFrame),64)/duration;
 lastFrame=now;
 const nextX=snake[0].x+dir[0], nextY=snake[0].y+dir[1];
 if(nextX<0||nextX>=N||nextY<0||nextY>=N){
   if(progress>=0.06){
     progress=0.06;
     draw();
     overlay('end','本局结束','本局得分：'+points+' 分','再玩一次');
     return;
   }
 }
 if(progress>=1){
   progress-=1;
   step();
   if(phase!=='play')progress=0;
   else if(queue.length)dir=queue.shift();
 }
 draw();
 if(phase==='play')frameId=requestAnimationFrame(animate);
}
function step(){
 if(phase!=='play')return;
 let p={x:snake[0].x+dir[0],y:snake[0].y+dir[1]};const correct=p.x===food.x&&p.y===food.y;
 const wrong=p.x===decoy.x&&p.y===decoy.y;
 const grow=correct && snake.length<N*N-2;
 if(p.x<0||p.x>=N||p.y<0||p.y>=N||snake.slice(0,grow?snake.length:-1).some(s=>s.x===p.x&&s.y===p.y)){overlay('end','本局结束','本局得分：'+points+' 分','再玩一次');return}
 snake.unshift(p);
 if(!grow)snake.pop();
 if(!correct&&!wrong)return;
 points+=correct?2:-3;
 el('score').textContent=fmt(points);
 if(points>record){
   record=points;
   el('best').textContent=fmt(record);
   try{localStorage.photoSnakeBest=record}catch{}
 }
 if(points>=49){
   food=decoy=null;
   overlay('win','恭喜你赢了','本局得分：'+points+' 分','再玩一次');
 }else spawn();
}
function play(){if(phase==='play')return;if(phase!=='paused'&&phase!=='ready')reset();phase='play';el('cover').hidden=true;el('pause').disabled=false;lastFrame=performance.now();frameId=requestAnimationFrame(animate)}
function pause(){if(phase==='play')overlay('paused','休息一下','照片还在等你。','继续游戏')}
function turn(d){const last=queue[queue.length-1]||dir;if(phase==='play'&&queue.length<2&&d[0]*last[0]+d[1]*last[1]===0)queue.push(d)}
el('action').onclick=play;el('pause').onclick=pause;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(b.dataset.d.split(',').map(Number)));
const keys={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};onkeydown=e=>{if(keys[e.key]){e.preventDefault();turn(keys[e.key])}else if(e.code==='Space'&&(phase==='play'||phase==='paused')){e.preventDefault();if(!e.repeat){if(phase==='play')pause();else play()}}};
let start=null;canvas.onpointerdown=e=>{start=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!start)return;let x=e.clientX-start[0],y=e.clientY-start[1];if(Math.max(Math.abs(x),Math.abs(y))<11)return;turn(Math.abs(x)>Math.abs(y)?[Math.sign(x),0]:[0,Math.sign(y)]);start=[e.clientX,e.clientY]};canvas.onpointerup=canvas.onpointercancel=()=>start=null;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});phase='ready';reset()
</script></html>
